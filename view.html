<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p5front — view</title>
  <link rel="stylesheet" href="css/app.css?v=2" />
  <style>
    body.view { overflow: hidden; background: var(--bg); }
    #runner-wrap { position: fixed; inset: 0; background: var(--bg); }
    #runner-wrap iframe { border: 0; width: 100%; height: 100%; display: block; }

    /* Semi-transparent toggle in the bottom-right corner. */
    #console-toggle {
      position: fixed; right: 12px; bottom: 12px; z-index: 20;
      width: 34px; height: 34px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 15px; line-height: 1;
      border-radius: 8px; opacity: .22; transition: opacity .18s;
      background: var(--bg-panel); color: var(--text); border: 1px solid var(--border);
    }
    #console-toggle:hover, #console-toggle.active { opacity: 1; }

    /* Collapsed console: hidden by default, floats above the toggle. */
    #console-panel {
      position: fixed; right: 12px; bottom: 56px; z-index: 20;
      width: min(440px, 92vw); height: min(240px, 45vh);
      display: none; flex-direction: column; overflow: hidden;
      border: 1px solid var(--border); border-radius: 10px;
      background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(3px);
    }
    #console-panel.open { display: flex; }
    #console-panel .cp-head {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600; color: var(--text-soft);
    }
    #console-panel .cp-head .spacer { flex: 1; }
    #console-panel .cp-head button { padding: 0 6px; font-size: 13px; }
    #console-body {
      flex: 1; overflow-y: auto; padding: 6px 10px;
      font-family: var(--mono); font-size: 12px;
    }
    #console-body .line { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
    #console-body .err { color: #e5484d; }
    #console-body .warn { color: #d9880a; }
  </style>
</head>
<body class="view">
  <div id="runner-wrap">
    <iframe id="runner"
            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals allow-popups allow-forms"></iframe>
  </div>

  <div id="console-panel">
    <div class="cp-head">
      Console <span class="spacer"></span>
      <button id="console-clear" class="ghost" title="Clear">clear</button>
      <button id="console-close" class="ghost" title="Hide console">✕</button>
    </div>
    <div id="console-body"></div>
  </div>

  <button id="console-toggle" title="Show console">&gt;_</button>

  <script src="js/util.js?v=2"></script>
  <script src="js/storage.js?v=2"></script>
  <script>
    (function () {
      const params  = new URLSearchParams(location.search);
      const id      = params.get('id');
      const runner  = document.getElementById('runner');
      const panel   = document.getElementById('console-panel');
      const body    = document.getElementById('console-body');
      const toggle  = document.getElementById('console-toggle');

      if (!id) { document.title = 'p5front — view (no project)'; return; }

      // Title from the registry (falls back to the id).
      const reg = getRegistry();
      document.title = (reg[id] && reg[id].name ? reg[id].name : id) + ' — p5front';

      // Console panel show/hide.
      function setConsole(open) {
        panel.classList.toggle('open', open);
        toggle.classList.toggle('active', open);
        toggle.title = open ? 'Hide console' : 'Show console';
      }
      toggle.onclick = () => setConsole(!panel.classList.contains('open'));
      document.getElementById('console-close').onclick = () => setConsole(false);
      document.getElementById('console-clear').onclick = () => { body.innerHTML = ''; };

      function logLine(text, cls) {
        const el = document.createElement('div');
        el.className = 'line' + (cls ? ' ' + cls : '');
        el.textContent = text;
        body.appendChild(el);
        body.scrollTop = body.scrollHeight;
      }

      // Messages forwarded from the sketch runner (SW-injected instrumentation).
      window.addEventListener('message', (e) => {
        const d = e.data;
        if (!d || d.__p5front !== true) return;
        const cls = d.type === 'error' ? 'err' : (d.type === 'warn' ? 'warn' : '');
        logLine(d.text, cls);
        if (d.type === 'error') setConsole(true);   // auto-reveal on error
      });

      // Register the SW and run the sketch full-window.
      async function run() {
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('sw.js');
            await navigator.serviceWorker.ready;
          } catch (e) { logLine('Service Worker failed: ' + e.message, 'err'); setConsole(true); }
        } else {
          logLine('Service Worker not supported — cannot run.', 'err'); setConsole(true); return;
        }
        runner.src = `runner/${encodeURIComponent(id)}/index.html?t=${Date.now()}`;
      }
      run();
    })();
  </script>
</body>
</html>
