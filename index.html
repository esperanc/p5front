<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p5front</title>
  <link rel="stylesheet" href="css/app.css?v=8" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
</head>
<body class="ide">
  <div class="ide-grid">
    <div class="ide-head">
      <a class="logo" href="https://github.com/esperanc/p5front" target="_blank" rel="noopener" title="p5front on GitHub"><img id="logo-img" alt="p5front" /></a>
      <input id="pname" class="pname" title="Project name" />
      <span class="spacer"></span>
      <button id="projects-btn" title="Open a project">Open</button>
      <button id="run-btn" class="primary">▶ Run</button>
      <button id="stop-btn">■ Stop</button>
      <button id="view-btn" title="Open in a new window (view mode)">⧉ View</button>
      <button id="share-btn" title="Copy a share link">Share</button>
      <button id="import-btn">Import…</button>
      <button id="export-btn">Export zip</button>
      <button id="settings-btn" class="ghost icon" title="Preferences">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <input id="file-input" type="file" accept=".zip" hidden />
    </div>

    <div class="ide-side">
      <div class="side-title">
        Files <span class="spacer"></span>
        <button id="add-file" title="New file">＋</button>
        <button id="upload-file" title="Upload files">⤒</button>
        <input id="upload-input" type="file" multiple hidden />
      </div>
      <div id="filetree" class="filetree"></div>
    </div>

    <div id="rz1" class="resizer v rz1" title="Resize file list"></div>

    <div class="ide-editor">
      <div class="editor-topbar">
        <button id="toggle-side" class="ghost icon" title="Toggle file list">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
        <span id="current-file-label" class="current-file"></span>
      </div>
      <div id="ace-editor"></div>
    </div>

    <div id="rz2" class="resizer v rz2" title="Resize editor / preview"></div>

    <div class="ide-preview">
      <div class="preview-frame">
        <!-- allow-same-origin is required so the Service Worker controls this frame
             and serves the project's files from IndexedDB. -->
        <iframe id="runner"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals allow-popups allow-forms allow-downloads"></iframe>
        <div id="preview-placeholder" class="preview-placeholder">
          Press <strong>&nbsp;▶ Run&nbsp;</strong> to execute the sketch.
        </div>
      </div>
      <div id="rz3" class="resizer h rz3" title="Resize console"></div>
      <div id="console" class="console"></div>
    </div>
  </div>

  <!-- Projects modal -->
  <div id="projects-overlay" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <strong>Projects</strong>
        <span class="spacer"></span>
        <button id="sort-toggle" title="Toggle sort order">Sort: Date</button>
        <button id="modal-new" class="primary">New</button>
        <button id="close-projects" class="ghost" title="Close">✕</button>
      </div>
      <ul id="modal-project-list" class="modal-list"></ul>
      <div class="modal-foot">
        <button id="export-all" title="Download all projects as a runnable repository">⬇ Export all</button>
        <button id="import-all" title="Import projects from an export">⬆ Import…</button>
        <input id="import-all-input" type="file" accept=".zip" hidden />
      </div>
    </div>
  </div>

  <!-- Preferences modal -->
  <div id="settings-overlay" class="modal-overlay">
    <div class="modal-dialog settings">
      <div class="modal-head">
        <strong>Preferences</strong>
        <span class="spacer"></span>
        <button id="close-settings" class="ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-row">
          <label for="set-theme">Theme</label>
          <select id="set-theme">
            <option value="auto">Auto (system)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="set-font-family">Editor font</label>
          <select id="set-font-family">
            <option value="mono">System mono</option>
            <option value="menlo">Menlo</option>
            <option value="monaco">Monaco</option>
            <option value="consolas">Consolas</option>
            <option value="sfmono">SF Mono</option>
            <option value="courier">Courier New</option>
            <option value="jetbrains">JetBrains Mono</option>
            <option value="fira">Fira Code</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="set-font-size">Font size (px)</label>
          <input id="set-font-size" type="number" min="9" max="40" step="1" />
        </div>
        <div class="settings-row">
          <label for="set-tab-size">Tab size</label>
          <input id="set-tab-size" type="number" min="1" max="8" step="1" />
        </div>
        <div class="settings-row">
          <label for="set-soft-tabs">Soft tabs (spaces)</label>
          <input id="set-soft-tabs" type="checkbox" />
        </div>
        <div class="settings-row">
          <label for="set-wrap">Word wrap</label>
          <input id="set-wrap" type="checkbox" />
        </div>
        <div class="settings-row">
          <label for="set-invisibles">Show invisibles</label>
          <input id="set-invisibles" type="checkbox" />
        </div>
        <div class="settings-row">
          <label for="set-lint">Check JS syntax</label>
          <input id="set-lint" type="checkbox" />
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
  <script src="js/util.js?v=3"></script>
  <script src="js/storage.js?v=2"></script>
  <script src="js/formats.js?v=2"></script>
  <script src="js/share.js?v=3"></script>
  <script src="js/settings.js?v=4"></script>
  <script src="js/backup.js?v=4"></script>
  <script src="js/reorder.js?v=1"></script>
  <script src="js/ide_ui.js?v=10"></script>
</body>
</html>
