<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p5front</title>
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="favicon_io/site.webmanifest" />
  <link rel="stylesheet" href="css/app.css?v=12" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
</head>
<body class="ide">
  <div class="ide-grid">
    <div class="ide-head">
      <a class="logo" href="https://github.com/esperanc/p5front" target="_blank" rel="noopener" title="p5front on GitHub"><img id="logo-img" alt="p5front" /></a>
      <input id="pname" class="pname" title="Project name" />
      <button id="info-btn" class="ghost icon" title="Sketch info — description, tags, thumbnail">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </button>
      <span class="spacer"></span>
      <button id="projects-btn" title="Open a project">Open</button>
      <button id="run-btn" class="primary">▶ Run</button>
      <button id="stop-btn">■ Stop</button>
      <button id="view-btn" title="Open in a new window (view mode)">⧉ View</button>
      <button id="share-btn" title="Copy a share link">Share</button>
      <button id="import-btn">Import…</button>
      <button id="export-btn">Export zip</button>
      <button id="settings-btn" class="ghost icon" title="Preferences">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <input id="file-input" type="file" accept=".zip" hidden />
    </div>

    <div class="ide-side">
      <div class="side-title">
        Files <span class="spacer"></span>
        <button id="add-file" title="New file">＋</button>
        <button id="add-lib" title="Add a library from a URL (CDN)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </button>
        <button id="upload-file" title="Upload files">⤒</button>
        <input id="upload-input" type="file" multiple hidden />
      </div>
      <div id="filetree" class="filetree"></div>
    </div>

    <div id="rz1" class="resizer v rz1" title="Resize file list"></div>

    <div class="ide-editor">
      <div class="editor-topbar">
        <button id="toggle-side" class="ghost icon" title="Toggle file list">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
        <span id="current-file-label" class="current-file"></span>
      </div>
      <div id="ace-editor"></div>
    </div>

    <div id="rz2" class="resizer v rz2" title="Resize editor / preview"></div>

    <div class="ide-preview">
      <div class="preview-frame">
        <!-- allow-same-origin is required so the Service Worker controls this frame
             and serves the project's files from IndexedDB. -->
        <iframe id="runner"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals allow-popups allow-forms allow-downloads"></iframe>
        <div id="preview-placeholder" class="preview-placeholder">
          Press <strong>&nbsp;▶ Run&nbsp;</strong> to execute the sketch.
        </div>
      </div>
      <div id="rz3" class="resizer h rz3" title="Resize console"></div>
      <div id="console" class="console"></div>
    </div>
  </div>

  <!-- Projects modal -->
  <div id="projects-overlay" class="modal-overlay">
    <div class="modal-dialog projects">
      <div class="modal-head">
        <strong>Projects</strong>
        <span class="spacer"></span>
        <button id="sort-toggle" title="Toggle sort order">Sort: Date</button>
        <button id="modal-new" class="primary">New</button>
        <button id="close-projects" class="ghost" title="Close">✕</button>
      </div>
      <div class="proj-browser">
        <aside id="proj-rail" class="proj-rail"></aside>
        <div class="proj-main">
          <div class="modal-subhead">
            <input id="project-filter" type="text" placeholder="Filter by name…" />
          </div>
          <div id="proj-facets" class="proj-facets"></div>
          <ul id="modal-project-list" class="modal-list"></ul>
        </div>
      </div>
      <div class="modal-foot">
        <button id="export-all" title="Download all projects as a runnable repository">⬇ Export all</button>
        <button id="import-all" title="Import projects from an export">⬆ Import…</button>
        <input id="import-all-input" type="file" accept=".zip" hidden />
      </div>
    </div>
  </div>

  <!-- Preferences modal -->
  <div id="settings-overlay" class="modal-overlay">
    <div class="modal-dialog settings">
      <div class="modal-head">
        <strong>Preferences</strong>
        <span class="spacer"></span>
        <button id="close-settings" class="ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-row">
          <label for="set-theme">Theme</label>
          <select id="set-theme">
            <option value="auto">Auto (system)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="set-font-family">Editor font</label>
          <select id="set-font-family">
            <option value="mono">System mono</option>
            <option value="menlo">Menlo</option>
            <option value="monaco">Monaco</option>
            <option value="consolas">Consolas</option>
            <option value="sfmono">SF Mono</option>
            <option value="courier">Courier New</option>
            <option value="jetbrains">JetBrains Mono</option>
            <option value="fira">Fira Code</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="set-font-size">Font size (px)</label>
          <input id="set-font-size" type="number" min="9" max="40" step="1" />
        </div>
        <div class="settings-row">
          <label for="set-tab-size">Tab size</label>
          <input id="set-tab-size" type="number" min="1" max="8" step="1" />
        </div>
        <div class="settings-row">
          <label for="set-soft-tabs">Soft tabs (spaces)</label>
          <input id="set-soft-tabs" type="checkbox" />
        </div>
        <div class="settings-row">
          <label for="set-wrap">Word wrap</label>
          <input id="set-wrap" type="checkbox" />
        </div>
        <div class="settings-row">
          <label for="set-invisibles">Show invisibles</label>
          <input id="set-invisibles" type="checkbox" />
        </div>
        <div class="settings-row">
          <label for="set-lint">Check JS syntax</label>
          <input id="set-lint" type="checkbox" />
        </div>
      </div>
    </div>
  </div>

  <!-- New file modal -->
  <div id="newfile-overlay" class="modal-overlay">
    <div class="modal-dialog settings">
      <div class="modal-head">
        <strong>New file</strong>
        <span class="spacer"></span>
        <button id="close-newfile" class="ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-row">
          <label for="newfile-path">Path</label>
          <input id="newfile-path" type="text" placeholder="helper.js or shaders/tex.frag" />
        </div>
        <div id="newfile-js-opts" class="js-only">
          <div class="settings-row">
            <label for="newfile-include">Include <code>&lt;script&gt;</code> in index.html</label>
            <input id="newfile-include" type="checkbox" checked />
          </div>
          <div class="settings-row">
            <label for="newfile-module">Load as <code>type="module"</code></label>
            <input id="newfile-module" type="checkbox" />
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button id="newfile-cancel" class="ghost">Cancel</button>
        <button id="newfile-create" class="primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Add library modal -->
  <div id="addlib-overlay" class="modal-overlay">
    <div class="modal-dialog settings">
      <div class="modal-head">
        <strong>Add library</strong>
        <span class="spacer"></span>
        <button id="close-addlib" class="ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-row">
          <label for="addlib-url">URL</label>
          <input id="addlib-url" type="url" placeholder="https://cdn.jsdelivr.net/npm/…" />
        </div>
        <p class="modal-hint">A <code>.css</code> URL is added as a stylesheet; anything else as a
        <code>&lt;script&gt;</code> in <code>&lt;head&gt;</code>. A <code>.mjs</code> URL loads as a module.</p>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button id="addlib-cancel" class="ghost">Cancel</button>
        <button id="addlib-add" class="primary">Add</button>
      </div>
    </div>
  </div>

  <!-- Sketch info modal -->
  <div id="info-overlay" class="modal-overlay">
    <div class="modal-dialog info">
      <div class="modal-head">
        <strong>Sketch info</strong>
        <span class="spacer"></span>
        <button id="close-info" class="ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="info-grid">
          <div class="info-fields">
            <label class="info-label" for="info-title">Title</label>
            <input id="info-title" type="text" />
            <label class="info-label" for="info-collection">Collection <span class="info-hint">(path, e.g. course/2026)</span></label>
            <input id="info-collection" type="text" list="collection-suggestions" placeholder="e.g. sketches/generative" />
            <datalist id="collection-suggestions"></datalist>
            <label class="info-label" for="info-tags">Tags <span class="info-hint">(comma-separated)</span></label>
            <input id="info-tags" type="text" placeholder="generative, noise, wip" />
            <label class="info-label" for="info-desc">Description <span class="info-hint">(markdown)</span></label>
            <textarea id="info-desc" rows="8" placeholder="What is this sketch? How is it used?&#10;&#10;## Usage&#10;- click to…"></textarea>
          </div>
          <div class="info-side">
            <label class="info-label">Thumbnail</label>
            <div id="info-thumb" class="info-thumb"></div>
            <button id="info-thumb-capture">Capture from canvas</button>
            <button id="info-thumb-clear" class="ghost">Remove</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button id="info-cancel" class="ghost">Cancel</button>
        <button id="info-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Read description modal (from the Projects browser) -->
  <div id="read-overlay" class="modal-overlay">
    <div class="modal-dialog info">
      <div class="modal-head">
        <strong id="read-title">Sketch</strong>
        <span class="spacer"></span>
        <button id="read-open" class="primary">Open</button>
        <button id="close-read" class="ghost" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="read-thumb" class="read-thumb"></div>
        <div id="read-meta" class="read-meta"></div>
        <div id="read-tags" class="tags"></div>
        <div id="read-desc" class="md"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
  <script src="js/util.js?v=3"></script>
  <script src="js/storage.js?v=5"></script>
  <script src="js/meta.js?v=3"></script>
  <script src="js/formats.js?v=4"></script>
  <script src="js/share.js?v=3"></script>
  <script src="js/settings.js?v=4"></script>
  <script src="js/backup.js?v=11"></script>
  <script src="js/reorder.js?v=1"></script>
  <script src="js/ide_ui.js?v=20"></script>
</body>
</html>
